# Percorso radice per la cache e gli artefatti di Hugging Face
HF_HOME=/mnt/Games/.cache/huggingface

# Cache per i modelli e i dataset dell'Hub (CAS - Content-Addressable Storage)
HF_HUB_CACHE=/mnt/Games/.cache/huggingface/hub

# Retrocompatibilità per librerie Transformers legacy
TRANSFORMERS_CACHE=/mnt/Games/.cache/huggingface/hub
